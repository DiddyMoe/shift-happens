[package]
name = "shift-happens"
version = "0.1.0"
description = "Local-first Windows desktop app for hospital staff scheduling, with availability and PTO, coverage rules, schedule generation, and PDF/Excel exports."
license = "MIT"
edition = "2024"
rust-version = "1.94"
publish = false

[lib]
name = "shift_happens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.151"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "macros", "migrate"] }
time = { version = "=0.3.55", features = ["formatting", "parsing"] }
unicode-normalization = "=0.1.25"
uuid = { version = "=1.27.0", features = ["v4"] }
sha2 = { version = "=0.11.0", default-features = false }
libsqlite3-sys = { version = "=0.37.0", default-features = false }
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-single-instance = "=2.5.2"
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
rust_xlsxwriter = { version = "=0.99.1", default-features = false, features = ["constant_memory"] }
calamine = { version = "=0.36.1", default-features = false }
pdf-writer = "=0.15.0"
lopdf = { version = "=0.45.0", default-features = false }
skrifa = { version = "=0.48.0", default-features = false, features = ["std"] }
unicode-script = "=0.5.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

# No `panic = "abort"`: editor history relies on catch_unwind, and startup turns a
# Tauri event-loop panic into a visible error. Panic locations in the diagnostic
# log come from embedded `Location` data, so no debug info is needed.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
